<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyBridge - Hash Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #137fec;
      --bg-primary: #f6f7f8;
      --bg-secondary: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #64748b;
      --border-color: #e5e7eb;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 12px 28px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 20px 40px rgba(15, 23, 42, 0.12);
      --radius-md: 0.75rem;
      --radius-lg: 1rem;
      --accent-color: #10b981;
    }

    [data-theme="dark"] {
      --primary-color: #3b82f6;
      --bg-primary: #0f1115;
      --bg-secondary: #1a1d24;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: #2d3139;
      --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    .page-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
    }

    [data-theme="light"] .page-bg {
      background: radial-gradient(circle at 20% 30%, rgba(19, 127, 236, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.06) 0%, transparent 50%);
    }

    [data-theme="dark"] .page-bg {
      background: radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(147, 51, 234, 0.08) 0%, transparent 50%);
    }

    .container {
      max-width: 540px;
      width: 100%;
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 0;
      animation: slideIn 0.4s ease;
      position: relative;
      z-index: 1;
      border: 1px solid var(--border-color);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      padding: 2rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary-color);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .theme-toggle {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 0.5rem;
      transition: all 0.2s ease;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: auto;
    }

    .theme-toggle:hover {
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    .content {
      padding: 2rem;
    }

    h2 {
      margin-bottom: 1.5rem;
      color: var(--text-primary);
      font-size: 1.25rem;
      font-weight: 600;
    }

    label {
      display: block;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--text-primary);
      font-size: 0.875rem;
    }

    label details {
      margin-top: 0.5rem;
    }

    label summary {
      cursor: pointer;
      color: var(--primary-color);
      font-weight: 500;
      transition: color 0.2s;
    }

    label summary:hover {
      opacity: 0.8;
    }

    label ul {
      margin-top: 0.75rem;
      margin-left: 1.5rem;
      color: var(--text-secondary);
      font-size: 0.8125rem;
      line-height: 1.6;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      font-size: 0.9375rem;
      font-family: inherit;
      transition: all 0.2s ease;
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(19, 127, 236, 0.1);
    }

    [data-theme="dark"] input:focus,
    [data-theme="dark"] select:focus,
    [data-theme="dark"] textarea:focus {
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    select {
      cursor: pointer;
    }

    select[multiple] {
      padding: 0.5rem;
      min-height: 120px;
    }

    select option {
      padding: 0.5rem;
      border-radius: 0.375rem;
    }

    select option:checked {
      background: var(--primary-color);
      color: white;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      font-family: 'Courier New', monospace;
      font-size: 0.875rem;
    }

    button {
      width: 100%;
      padding: 0.875rem 1.5rem;
      background: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9375rem;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      font-family: inherit;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
      opacity: 0.9;
    }

    button:active {
      transform: translateY(0);
    }

    button[type="button"] {
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 0.625rem 1rem;
      font-size: 0.875rem;
    }

    button[type="button"]:hover {
      background: var(--bg-secondary);
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    .result {
      margin-top: 1rem;
      word-break: break-all;
      background: var(--bg-primary);
      padding: 1rem;
      border-radius: var(--radius-md);
      min-height: 48px;
      font-family: 'Courier New', monospace;
      font-size: 0.8125rem;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
      line-height: 1.5;
    }

    .result:not(:empty) {
      border-color: var(--accent-color);
      background: rgba(16, 185, 129, 0.08);
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      color: var(--text-secondary);
      font-size: 0.8125rem;
      font-weight: 500;
    }

    #copyBtn {
      background: var(--accent-color);
      margin-top: 0.5rem;
    }

    #copyBtn:hover {
      opacity: 0.9;
    }

    #copyBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .actions {
      display: grid;
      gap: 0.75rem;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-color);
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .header {
        padding: 1.5rem;
      }

      .content {
        padding: 1.5rem;
      }

      .brand-name {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="page-bg"></div>
  <div class="container">
    <div class="header">
      <div class="brand">
        <span class="brand-name">SkyBridge</span>
        <span class="brand-dot"></span>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <span id="themeIcon">🌙</span>
      </button>
    </div>

    <div class="content">
      <h2>Hash & Token Generator</h2>

      <label for="algoType">Select Type</label>
      <select id="algoType">
        <option value="hash">Hash (Password)</option>
        <option value="token">Token</option>
        <option value="hmac">HMAC</option>
      </select>

      <div id="tokenBlock" style="display: none;">
        <label for="tokenPath">Token Path</label>
        <input type="text" id="tokenPath" placeholder="e.g., /Abc" />

        <label for="tokenScope">
          <details>
            <summary>Permissions (Scopes)</summary>
            <ul>
              <li>download: Download file</li>
              <li>list: List directory contents</li>
              <li>upload: Upload file</li>
              <li>refresh: Refresh cache</li>
              <li>children: Access subpaths</li>
              <li>recursive: Recursively access subpaths</li>
            </ul>
          </details>
        </label>

        <div class="button-group">
          <button type="button" id="scopeAll">Select all</button>
          <button type="button" id="scopeCommon">Common</button>
        </div>
        <select id="tokenScope" multiple size="6">
          <option value="download">download</option>
          <option value="list">list</option>
          <option value="upload">upload</option>
          <option value="refresh">refresh</option>
          <option value="children">children</option>
          <option value="recursive">recursive</option>
        </select>

        <label for="tokenExpire">Expiration Time</label>
        <select id="tokenExpire">
          <option value="1d">One day</option>
          <option value="7d">One week</option>
          <option value="">Permanent</option>
          <option value="custom">Custom</option>
        </select>
        <input type="datetime-local" id="tokenExpireCustom" style="display: none; margin-top: 0.75rem;" />
      </div>

      <div id="messageBlock">
        <label for="message">Message / Password</label>
        <textarea id="message" rows="3" placeholder="Enter text to hash"></textarea>
      </div>

      <div id="keyBlock" style="display: none;">
        <label for="key">Key</label>
        <input type="text" id="key" placeholder="Enter key" />
      </div>

      <div id="algoBlock">
        <label for="algo">Hash Algorithm</label>
        <select id="algo">
          <option value="SHA-256">SHA-256</option>
          <option value="SHA-1">SHA-1</option>
          <option value="SHA-384">SHA-384</option>
          <option value="SHA-512">SHA-512</option>
        </select>
      </div>

      <div class="actions">
        <button id="calc">Calculate</button>
        <div class="result" id="result"></div>
        <button id="copyBtn" disabled>Copy Result</button>
      </div>

      <div class="footer">Powered by Web Crypto API</div>
    </div>
  </div>
  <script>
    // Theme toggle functionality
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const html = document.documentElement;

    // Initialize theme from localStorage or system preference
    const savedTheme = localStorage.getItem('theme') || 
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    html.setAttribute('data-theme', savedTheme);
    themeIcon.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    themeToggle.addEventListener('click', () => {
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      themeIcon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', newTheme);
    });

    // HMAC signing
    async function hmacHash(message, key, algo = 'SHA-256') {
      let msgUint8 = new TextEncoder().encode(message);
      let keyUint8 = new TextEncoder().encode(key);
      let cryptoKey = await crypto.subtle.importKey(
        'raw',
        keyUint8,
        { name: 'HMAC', hash: algo },
        true,
        ['sign', 'verify']
      );
      let sig = await crypto.subtle.sign('HMAC', cryptoKey, msgUint8);
      let b = [];
      let h = '0123456789abcdef';
      new Uint8Array(sig).forEach((v) => {
        b.push(h[v >>> 4] + h[v & 15]);
      });
      return b.join('');
    }

    // Hash only
    async function hashOnly(message, algo = 'SHA-256') {
      let msgUint8 = new TextEncoder().encode(message);
      let hashBuffer = await crypto.subtle.digest(algo, msgUint8);
      let b = [];
      let h = '0123456789abcdef';
      new Uint8Array(hashBuffer).forEach((v) => {
        b.push(h[v >>> 4] + h[v & 15]);
      });
      return b.join('');
    }

    // Copy button functionality
    const copyBtn = document.getElementById('copyBtn');
    const result = document.getElementById('result');
    
    const observer = new MutationObserver(() => {
      copyBtn.disabled = !result.innerText.trim();
    });
    observer.observe(result, { childList: true, characterData: true, subtree: true });

    copyBtn.addEventListener('click', () => {
      let resultText = result.innerText;
      if (resultText) {
        navigator.clipboard.writeText(resultText).then(() => {
          const originalText = copyBtn.textContent;
          copyBtn.textContent = '✓ Copied!';
          setTimeout(() => {
            copyBtn.textContent = originalText;
          }, 2000);
        });
      }
    });

    // Calculate hash/token
    document.getElementById('calc').addEventListener('click', async () => {
      let type = document.getElementById('algoType').value;
      let algo = document.getElementById('algo').value;
      let message = document.getElementById('message').value;
      
      if (!message.trim()) {
        result.innerText = 'Please enter a message/password';
        return;
      }

      if (type === 'token') {
        let path = document.getElementById('tokenPath').value;
        let scope = Array.from(document.getElementById('tokenScope').selectedOptions).map((el) => el.value);
        let expire = document.getElementById('tokenExpire').value;
        
        if (expire === 'custom') {
          expire = new Date(document.getElementById('tokenExpireCustom').value).getTime();
        }
        
        let r = {
          path: path,
          password: await hashOnly(message, algo),
          scope: scope
        };
        if (expire) r.expire = expire;
        result.innerText = btoa(JSON.stringify(r));
        return;
      }
      
      if (type === 'hmac') {
        let key = document.getElementById('key').value;
        if (!key.trim()) {
          result.innerText = 'Please enter a key for HMAC';
          return;
        }
        result.innerText = await hmacHash(message, key, algo);
      } else {
        result.innerText = await hashOnly(message, algo);
      }
    });

    // Type selector change
    document.getElementById('algoType').addEventListener('change', function (event) {
      let type = event.target.value;
      if (type === 'hmac') {
        document.getElementById('keyBlock').style.display = 'block';
        document.getElementById('algoBlock').style.display = 'block';
        document.getElementById('tokenBlock').style.display = 'none';
        document.getElementById('messageBlock').style.display = 'block';
      } else if (type === 'hash') {
        document.getElementById('keyBlock').style.display = 'none';
        document.getElementById('algoBlock').style.display = 'block';
        document.getElementById('tokenBlock').style.display = 'none';
        document.getElementById('messageBlock').style.display = 'block';
      } else {
        document.getElementById('keyBlock').style.display = 'none';
        document.getElementById('algoBlock').style.display = 'block';
        document.getElementById('tokenBlock').style.display = 'block';
        document.getElementById('messageBlock').style.display = 'block';
      }
    });

    // Scope selector buttons
    document.getElementById('scopeAll').addEventListener('click', function () {
      let tokenScope = document.getElementById('tokenScope');
      for (let i = 0; i < tokenScope.options.length; i++) {
        tokenScope.options[i].selected = true;
      }
    });

    document.getElementById('scopeCommon').addEventListener('click', function () {
      let tokenScope = document.getElementById('tokenScope');
      for (let i = 0; i < tokenScope.options.length; i++) {
        tokenScope.options[i].selected = false;
      }
      tokenScope.options[0].selected = true; // download
      tokenScope.options[1].selected = true; // list
      tokenScope.options[4].selected = true; // children
    });

    // Token expiry custom date
    document.getElementById('tokenExpire').addEventListener('change', function (event) {
      if (event.target.value === 'custom') {
        document.getElementById('tokenExpireCustom').style.display = 'block';
      } else {
        document.getElementById('tokenExpireCustom').style.display = 'none';
      }
    });
  </script>
</body>

</html>
